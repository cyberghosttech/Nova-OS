<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         WELCOME SCREEN
    ========================== -->
    <section id="welcomeScreen" class="welcome-screen">

        <div class="welcome-card">

            <div class="nova-logo large-logo">
                ✦
            </div>

            <h1>Welcome to NovaOS</h1>

            <p>
                A simple browser-based operating system
                built from scratch.
            </p>

            <button id="startButton" class="primary-button">
                Start NovaOS
            </button>

            <div class="welcome-info">
                <span>NovaOS 1.0</span>
                <span>•</span>
                <span>WebOS Project</span>
            </div>

        </div>

    </section>


    <!-- =========================
         OPERATING SYSTEM
    ========================== -->
    <main id="desktop" class="desktop hidden">

        <!-- TOP BAR -->
        <header class="top-bar">

            <div class="top-left">

                <button id="menuButton" class="top-button">
                    ✦ NovaOS
                </button>

            </div>

            <div class="top-center">
                <span id="activeAppName">Desktop</span>
            </div>

            <div class="top-right">

                <span id="systemStatus" class="system-status">
                    ● Online
                </span>

                <span id="clock">
                    00:00
                </span>

            </div>

        </header>


        <!-- DESKTOP AREA -->
        <section id="desktopArea" class="desktop-area">

            <!-- DESKTOP ICONS -->

            <button class="desktop-icon" data-open-app="files">
                <span class="desktop-icon-image">📁</span>
                <span>Files</span>
            </button>

            <button class="desktop-icon" data-open-app="notes">
                <span class="desktop-icon-image">📝</span>
                <span>Notes</span>
            </button>

            <button class="desktop-icon" data-open-app="settings">
                <span class="desktop-icon-image">⚙️</span>
                <span>Settings</span>
            </button>

            <button class="desktop-icon" data-open-app="about">
                <span class="desktop-icon-image">💻</span>
                <span>About</span>
            </button>


            <!-- WINDOWS WILL BE INSERTED HERE -->

        </section>


        <!-- =========================
             BOTTOM DOCK
        ========================== -->
        <nav class="dock">

            <button class="dock-button" data-open-app="files" title="Files">
                📁
            </button>

            <button class="dock-button" data-open-app="notes" title="Notes">
                📝
            </button>

            <button class="dock-button" data-open-app="settings" title="Settings">
                ⚙️
            </button>

            <button class="dock-button" data-open-app="about" title="About NovaOS">
                💻
            </button>

            <span class="dock-divider"></span>

            <button id="restartButton" class="dock-button" title="Restart">
                🔄
            </button>

            <button id="shutdownButton" class="dock-button" title="Shutdown">
                ⏻
            </button>

        </nav>


        <!-- =========================
             START MENU
        ========================== -->
        <div id="startMenu" class="start-menu hidden">

            <div class="start-menu-header">

                <div class="nova-logo">
                    ✦
                </div>

                <div>
                    <strong>NovaOS</strong>
                    <small>WebOS 1.0</small>
                </div>

            </div>

            <div class="start-menu-apps">

                <button data-open-app="files">
                    <span>📁</span>
                    Files
                </button>

                <button data-open-app="notes">
                    <span>📝</span>
                    Notes
                </button>

                <button data-open-app="settings">
                    <span>⚙️</span>
                    Settings
                </button>

                <button data-open-app="about">
                    <span>💻</span>
                    About NovaOS
                </button>

            </div>

            <div class="start-menu-footer">
                Built for the WebOS 1 project
            </div>

        </div>


        <!-- =========================
             SHUTDOWN SCREEN
        ========================== -->
        <div id="shutdownScreen" class="shutdown-screen hidden">

            <div class="shutdown-card">

                <div class="nova-logo large-logo">
                    ✦
                </div>

                <h2 id="shutdownTitle">
                    NovaOS is shutting down
                </h2>

                <p id="shutdownMessage">
                    Thanks for using NovaOS.
                </p>

                <button id="restartFromShutdown" class="primary-button">
                    Restart NovaOS
                </button>

            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>s
